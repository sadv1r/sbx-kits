# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Pi
description: Minimal terminal coding agent with extensible tools, skills, and TUI
sourceUrl: https://pi.dev
version: "1.0.0"
provides: ["pi"]

args:
  version:
    default: latest
    pattern: '^(latest|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
    description: Pi release to install (latest or an exact version)
    buildArg: PI_VERSION

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - registry.npmjs.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: 'if [ -n "${HTTP_PROXY:-}" ]; then npm config set proxy="$HTTP_PROXY" https-proxy="${HTTPS_PROXY:-$HTTP_PROXY}"; fi'
          user: agent
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Configure npm to use the sandbox proxy

  - type: com.docker.sandbox/agent-sessions@1
    description: Drive Pi non-interactively
    config:
      prompt: ["-p", "{{.Prompt}}"]

  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md

  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills
